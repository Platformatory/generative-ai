bundle:
  name: skyjet-support-app

resources:
  apps:
    skyjet_support:
      name: skyjet-support-app
      source_code_path: ./src
      config:
        command: ["uv", "run", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: SERVING_ENDPOINT
            value: databricks-meta-llama-3-3-70b-instruct
          - name: UC_TOOL_CATALOG
            value: module5b
          - name: UC_TOOL_SCHEMA
            value: skyjet
          - name: VS_ENDPOINT
            value: module5b_vs_endpoint
          - name: VS_INDEX
            value: module5b.skyjet.policies_index
          - name: MLFLOW_EXPERIMENT_NAME
            value: /Users/shriveens@platformatory.com/module5b_skyjet_production
